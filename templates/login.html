<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Phased</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=Inter:wght@400;500&family=Newsreader:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    </head>
    <body>
        <aside class="side">
            <div class="circles" aria-hidden="true">
                <span class="circle c1"></span>
                <span class="circle c2"></span>
                <span class="circle c3"></span>
                <span class="circle c4"></span>
                <span class="circle c5"></span>
                <span class="circle c6"></span>
            </div>
            <a class="logo" href="/">phased.</a>
            <div class="side_body">
                <p class="eyebrow">Welcome back</p>
                <h1>good to see you again</h1>
                <p class="side_text">Pick up where you left off. Your plan adapts to your cycle every day.</p>
            </div>
        </aside>

        <main class="main">
            <a class="back" href="/">back</a>
            <form class="f">
                <div>
                    <h2>Log in</h2>
                    <p class="sub">Enter your details to continue.</p>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email">
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                </div>
                <button class="btn" type="button">Login</button>
                <p class="alt">Don’t have an account? <a href="/signup">Sign Up!</a></p>
            </form>
        </main>
    </body>
</html>
