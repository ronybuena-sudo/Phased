<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Phased</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=Inter:wght@400;500;600&family=Newsreader:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    </head>
    <body>
        <aside class="side">
            <div class="circles" aria-hidden="true">
                <span class="circle c1"></span>
                <span class="circle c2"></span>
                <span class="circle c3"></span>
                <span class="circle c4"></span>
                <span class="circle c5"></span>
                <span class="circle c6"></span>
            </div>
            <a class="logo" href="/">phased.</a>
            <div class="side_body">
                <p class="eyebrow">Step 3 of 3</p>
                <h1>one last step!</h1>
                <p class="side_text">This helps us match your calories to your cycle.</p>
            </div>
        </aside>
        <main class="main">
            <a class="back" href="/onboard2">back</a>
            <form class="f" method="POST" action="/onboard3">
                <div>
                    <h2>Almost there</h2>
                    <p class="sub">Two quick questions and you’re in.</p>
                </div>
                <div>
                    <label for="activity">What is your activity level?</label>
                    <select name="activity" id="activity">
                        <option value="sedentary">Little to No Activity</option>
                        <option value="lightly active">Lightly Active (1-3 days per week)</option>
                        <option value="moderately active">Moderately Active (3-5 days per week)</option>
                        <option value="very active">Very Active (6-7 days per week)</option>
                    </select>
                </div>
                <div>
                    <label for="period">When was your last period?</label>
                    <input type="date" id="period" name="period">
                </div>
                <button class="btn" type="submit">All Set!</button>
            </form>
        </main>
    </body>
</html>
